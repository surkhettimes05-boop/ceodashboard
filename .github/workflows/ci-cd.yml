name: CEO V1 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ceodashboard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceodashboard_test
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceodashboard_test
      - run: npx tsc --noEmit
      - name: Unit and contract tests
        run: npx vitest run src
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceodashboard_test
          NODE_ENV: test
          JWT_SECRET: ci-only-jwt-secret-32-characters-minimum
          JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum
          FEEDBACK_TOKEN_SECRET: ci-only-feedback-secret
          PASALO_WEBHOOK_SECRET: ci-only-webhook-secret
      - name: Integration tests
        continue-on-error: true
        run: npx vitest run tests/integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceodashboard_test
          NODE_ENV: test
          JWT_SECRET: ci-only-jwt-secret-32-characters-minimum
          JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum
          FEEDBACK_TOKEN_SECRET: ci-only-feedback-secret
          PASALO_WEBHOOK_SECRET: ci-only-webhook-secret
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
